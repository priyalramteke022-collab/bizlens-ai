<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BizLens AI - Business Data Analyzer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
    }

    .header {
      background: #111827;
      color: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 36px;
    }

    .header p {
      margin: 10px 0 0;
      color: #d1d5db;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      resize: vertical;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      display: none;
    }

    .result-title {
      font-size: 24px;
      margin-bottom: 20px;
    }

    /* HEALTH SCORE */

    .health-box {
      text-align: center;
      background: #f9fafb;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .score {
      font-size: 58px;
      font-weight: bold;
      margin: 10px 0;
    }

    .score-label {
      font-size: 19px;
      font-weight: bold;
    }

    .score-description {
      color: #6b7280;
      margin-top: 8px;
    }

    .score-bar {
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 18px;
    }

    .score-fill {
      height: 100%;
      width: 0%;
      background: #111827;
      transition: width 0.6s ease;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .metric {
      padding: 18px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #f9fafb;
    }

    .metric-name {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 23px;
      font-weight: bold;
    }

    .insights {
      margin-top: 25px;
    }

    .insight {
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 12px;
      background: #f3f4f6;
    }

    .good {
      border-left: 5px solid #16a34a;
    }

    .warning {
      border-left: 5px solid #dc2626;
    }

    .info {
      border-left: 5px solid #2563eb;
    }

    .small {
      margin-top: 15px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }

    .priority {
      padding: 18px;
      border-radius: 14px;
      background: #f9fafb;
      border-left: 5px solid #111827;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .metrics {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 29px;
      }

      body {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🤖 BizLens AI</h1>
      <p>Business Data Analyzer</p>
    </div>

    <div class="card">

      <label for="data">Enter your business data</label>

      <textarea
        id="data"
        placeholder="Example:
Sales: ₹5,00,000
Expenses: ₹3,50,000
Customers: 800"></textarea>

      <button onclick="analyzeBusiness()">
        🔍 Analyze Business
      </button>

      <p class="small">
        Tip: Enter Sales, Expenses and Customers for a more useful analysis.
      </p>

    </div>

    <div class="card" id="result">

      <div class="result-title">
        📊 Business Analysis
      </div>

      <!-- HEALTH SCORE -->

      <div class="health-box">

        <div>🏆 Business Health Score</div>

        <div class="score" id="healthScore">
          0/100
        </div>

        <div class="score-label" id="healthLabel">
          -
        </div>

        <div class="score-description" id="healthDescription">
          -
        </div>

        <div class="score-bar">
          <div class="score-fill" id="scoreFill"></div>
        </div>

      </div>

      <!-- ORIGINAL METRICS -->

      <div class="metrics">

        <div class="metric">
          <div class="metric-name">Sales / Revenue</div>
          <div class="metric-value" id="sales">₹0</div>
        </div>

        <div class="metric">
          <div class="metric-name">Expenses</div>
          <div class="metric-value" id="expenses">₹0</div>
        </div>

        <div class="metric">
          <div class="metric-name">Profit</div>
          <div class="metric-value" id="profit">₹0</div>
        </div>

        <div class="metric">
          <div class="metric-name">Profit Margin</div>
          <div class="metric-value" id="margin">0%</div>
        </div>

        <div class="metric">
          <div class="metric-name">Customers</div>
          <div class="metric-value" id="customers">0</div>
        </div>

        <div class="metric">
          <div class="metric-name">Revenue / Customer</div>
          <div class="metric-value" id="revenuePerCustomer">₹0</div>
        </div>

      </div>

      <!-- INSIGHTS -->

      <div class="insights">

        <h3>💡 BizLens Insights</h3>

        <div id="insightBox"></div>

      </div>

      <!-- PRIORITY ACTION -->

      <div class="priority">

        <b>🎯 Priority Action</b>

        <p id="priorityAction">
          -
        </p>

      </div>

    </div>

  </div>

  <script>

    function getNumber(text, patterns) {

      for (let pattern of patterns) {

        const regex = new RegExp(
          pattern + "\\s*[:=]?\\s*[₹$€£]?\\s*([0-9,]+(?:\\.[0-9]+)?)",
          "i"
        );

        const match = text.match(regex);

        if (match) {
          return parseFloat(match[1].replace(/,/g, ""));
        }
      }

      return 0;
    }


    function formatMoney(number) {

      return "₹" + Math.round(number).toLocaleString("en-IN");

    }


    function calculateHealthScore(sales, expenses, customers) {

      if (sales <= 0) {
        return 0;
      }

      const profit = sales - expenses;

      const margin = (profit / sales) * 100;

      let score = 0;


      /* Profitability: 50 points */

      if (margin >= 30) {
        score += 50;
      }

      else if (margin >= 20) {
        score += 42;
      }

      else if (margin >= 10) {
        score += 32;
      }

      else if (margin >= 0) {
        score += 20;
      }

      else {
        score += 0;
      }


      /* Expense control: 30 points */

      const expenseRatio = expenses / sales;

      if (expenseRatio <= 0.50) {
        score += 30;
      }

      else if (expenseRatio <= 0.60) {
        score += 25;
      }

      else if (expenseRatio <= 0.70) {
        score += 18;
      }

      else if (expenseRatio <= 0.85) {
        score += 10;
      }

      else {
        score += 0;
      }


      /* Customer data: 20 points */

      if (customers > 0) {
        score += 20;
      }

      else {
        score += 5;
      }


      return Math.round(score);

    }


    function analyzeBusiness() {

      const data = document
        .getElementById("data")
        .value
        .trim();


      if (!data) {

        alert("Please enter your business data first.");

        return;
      }


      const sales = getNumber(data, [
        "sales",
        "revenue",
        "income"
      ]);


      const expenses = getNumber(data, [
        "expenses",
        "expense",
        "cost",
        "costs"
      ]);


      const customers = getNumber(data, [
        "customers",
        "customer",
        "clients",
        "client"
      ]);


      const profit = sales - expenses;


      let margin = 0;

      if (sales > 0) {
        margin = (profit / sales) * 100;
      }


      let revenuePerCustomer = 0;

      if (customers > 0) {
        revenuePerCustomer = sales / customers;
      }


      /* ORIGINAL RESULTS */

      document.getElementById("sales").textContent =
        formatMoney(sales);

      document.getElementById("expenses").textContent =
        formatMoney(expenses);

      document.getElementById("profit").textContent =
        formatMoney(profit);

      document.getElementById("margin").textContent =
        margin.toFixed(1) + "%";

      document.getElementById("customers").textContent =
        customers.toLocaleString("en-IN");

      document.getElementById("revenuePerCustomer").textContent =
        formatMoney(revenuePerCustomer);


      /* HEALTH SCORE */

      const healthScore =
        calculateHealthScore(
          sales,
          expenses,
          customers
        );


      document.getElementById("healthScore").textContent =
        healthScore + "/100";


      document.getElementById("scoreFill").style.width =
        healthScore + "%";


      let healthLabel = "";
      let healthDescription = "";


      if (healthScore >= 80) {

        healthLabel = "🟢 Excellent";

        healthDescription =
          "The business looks financially strong based on the data entered.";

      }

      else if (healthScore >= 60) {

        healthLabel = "🟡 Good";

        healthDescription =
          "The business has a healthy foundation, but there is room for improvement.";

      }

      else if (healthScore >= 40) {

        healthLabel = "🟠 Needs Attention";

        healthDescription =
          "Some important business areas need attention.";

      }

      else {

        healthLabel = "🔴 Critical";

        healthDescription =
          "The entered numbers show significant areas that need improvement.";

      }


      document.getElementById("healthLabel").textContent =
        healthLabel;

      document.getElementById("healthDescription").textContent =
        healthDescription;


      /* INSIGHTS */

      const insightBox =
        document.getElementById("insightBox");


      insightBox.innerHTML = "";


      function addInsight(icon, title, text, type) {

        const div = document.createElement("div");

        div.className =
          "insight " + type;

        div.innerHTML =
          "<b>" + icon + " " + title + "</b><br>" +
          text;

        insightBox.appendChild(div);

      }


      if (sales === 0) {

        addInsight(
          "⚠️",
          "Sales data missing",
          "Enter your Sales or Revenue amount to calculate business performance.",
          "warning"
        );

      }

      else {

        addInsight(
          "💰",
          "Financial result",
          "Your calculated profit is " +
          formatMoney(profit) + ".",
          profit >= 0 ? "good" : "warning"
        );


        if (margin >= 30) {

          addInsight(
            "🚀",
            "Strong margin",
            "The calculated profit margin is " +
            margin.toFixed(1) +
            "%. This indicates a relatively strong margin based on the data entered.",
            "good"
          );

        }

        else if (margin >= 10) {

          addInsight(
            "📈",
            "Moderate margin",
            "The calculated profit margin is " +
            margin.toFixed(1) +
            "%. Look for ways to increase revenue or reduce unnecessary costs.",
            "info"
          );

        }

        else if (margin >= 0) {

          addInsight(
            "⚠️",
            "Low margin",
            "The calculated profit margin is only " +
            margin.toFixed(1) +
            "%. Review your major expenses and pricing.",
            "warning"
          );

        }

        else {

          addInsight(
            "🚨",
            "Loss detected",
            "Expenses are higher than sales in the data entered. Review costs and revenue sources.",
            "warning"
          );

        }


        if (expenses > sales * 0.70) {

          addInsight(
            "💸",
            "High expenses",
            "Expenses are more than 70% of sales. Finding unnecessary costs could improve profitability.",
            "warning"
          );

        }


        if (customers > 0) {

          addInsight(
            "👥",
            "Customer value",
            "Average revenue per customer from the entered data is " +
            formatMoney(revenuePerCustomer) + ".",
            "info"
          );

        }

        else {

          addInsight(
            "👥",
            "Customer data missing",
            "Add your customer count to estimate revenue per customer.",
            "info"
          );

        }


        addInsight(
          "🏆",
          "Health score",
          "BizLens AI calculated a Business Health Score of " +
          healthScore +
          "/100 from the numbers you entered.",
          healthScore >= 60 ? "good" : "warning"
        );


        addInsight(
          "💡",
          "Next action",
          "Compare these numbers with previous months to identify whether your business is improving or declining.",
          "info"
        );

      }


      /* PRIORITY ACTION */

      let priority = "";


      if (sales === 0) {

        priority =
          "Enter your sales/revenue data first.";

      }

      else if (profit < 0) {

        priority =
          "Reduce unnecessary expenses and investigate why costs are higher than revenue.";

      }

      else if (margin < 10) {

        priority =
          "Focus on improving your profit margin by controlling major costs and reviewing pricing.";

      }

      else if (expenses > sales * 0.70) {

        priority =
          "Expenses are taking a large share of revenue. Identify the biggest cost categories to optimize.";

      }

      else if (customers === 0) {

        priority =
          "Add customer data so BizLens AI can calculate customer-level performance.";

      }

      else {

        priority =
          "Maintain profitability and compare this result with previous periods to find business trends.";

      }


      document.getElementById("priorityAction").textContent =
        priority;


      document.getElementById("result").style.display =
        "block";

    }

  </script>

</body>
       </html>
