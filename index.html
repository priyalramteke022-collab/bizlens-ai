<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizLens AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    textarea {
      width: 100%;
      height: 150px;
      margin-top: 20px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      margin-top: 15px;
      padding: 13px 25px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f1f3f5;
      border-radius: 10px;
      text-align: left;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>BizLens AI</h1>

    <p>Business Data Analyzer</p>

    <textarea id="data" placeholder="Enter your business data here..."></textarea>

    <button onclick="analyze()">Analyze Business</button>

    <div id="result">
      Your analysis will appear here.
    </div>
  </div>

  <script>
    function analyze() {
      const data = document.getElementById("data").value.trim();

      if (!data) {
        document.getElementById("result").innerHTML =
          "⚠️ Please enter some business data first.";
        return;
      }

      document.getElementById("result").innerHTML = `
        <b>📊 Initial Analysis</b><br><br>
        Data received successfully.<br>
        BizLens AI is ready for deeper analysis.<br><br>
        💡 Next version: sales, expenses, profit and business opportunity detection.
      `;
    }
  </script>

</body>
  </html>
